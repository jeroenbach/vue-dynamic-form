packages:
  - 'packages/*'
  - '!playgrounds'
  - '!docs'

allowBuilds:
  # sass pulls this in optionally; its prebuilt binaries make the build script unnecessary
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  esbuild: true
  vue-demi: true

overrides:
  nanoid: ^3.3.18
  postcss: ^8.5.18
  source-map-js: ^1.2.2

catalogs:
  build:
    '@vitejs/plugin-vue': 6.0.1
    sass-embedded: 1.107.1
    tsc-alias: 1.8.17
    vite: 7.3.6
    vue-tsc: 3.0.5

  dev:
    '@antfu/eslint-config': 5.2.1
    eslint: 9.33.0
    eslint-plugin-format: 1.0.1

  framework:
    '@bach.software/vue-dynamic-form': '>=0.1.0'
    '@lucide/vue': '>=1 <2'
    '@vee-validate/rules': '>=4.12'
    vee-validate: '>=4.12'
    vue: '^3.5.44'

  test:
    '@vitest/coverage-v8': 3.2.6
    '@vue/test-utils': 2.4.6
    axe-core: 4.14.0
    jsdom: 26.0.0
    vitest: 3.2.6

  tooling:
    '@changesets/cli': 2.29.5

  types:
    '@types/node': 24.2.1
    typescript: 5.9.2
